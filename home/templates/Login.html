{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Netflix Tudum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-dark text-white">

{% include "_navbar.html" with active="login" %}

<main class="d-flex justify-content-center align-items-center auth-wrapper">
    <div class="card auth-card login-card p-5 reveal in-view">
        <h3 class="text-center mb-4">
            <i class="fas fa-play-circle text-danger"></i> Netflix Tudum
        </h3>
        <p class="text-center text-muted mb-4">Sign in to sync your account details</p>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email / Username</label>
                <input type="text" name="username" class="form-control bg-dark border-secondary text-white" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control bg-dark border-secondary text-white" required>
            </div>

            <button type="submit" class="btn btn-danger w-100 fw-bold">
                <i class="fas fa-sign-in-alt me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center border-top border-secondary mt-4 pt-4">
            <p class="text-muted mb-0">
                New to Netflix Tudum?
                <a href="{% url 'register' %}" class="text-danger text-decoration-none fw-bold">Create an account</a>
            </p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
